services:
  bol-outreach:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bol-outreach-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/bol-outreach.db
    volumes:
      # Persist SQLite database
      - bol-data:/app/data
      # Optional: Mount logs directory
      - bol-logs:/app/logs
    networks:
      - bol-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  bol-data:
    driver: local
  bol-logs:
    driver: local

networks:
  bol-network:
    driver: bridge